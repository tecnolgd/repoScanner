[build-system]
requires = ["setuptools", "wheel", "setuptools_scm[toml]>=6.2", "pybind11>=2.10.0"]
build-backend = "setuptools.build_meta"

[project]
name = "repoScanner"
dynamic = ["version"]
description = "A lightweight CLI tool for rapid codebase analysis with native C++ acceleration."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "tecnolgd" }]
keywords = ["repo", "scanner", "analysis", "cpp", "pybind11", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
]
dependencies = []


[project.optional-dependencies]
dev = ["build", "twine"]

# Creates the CLI executable command
[project.scripts]
reposcan = "repoScan.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["repoScan*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"repoScan" = ["data/*", "docs/*"]

[tool.setuptools_scm]
version_scheme = "guess-next-dev"
local_scheme = "no-local-version"
write_to = "repoScan/_version.py"
fallback_version = "0.3.0b9"

[project.urls]
Homepage = "https://github.com/tecnolgd/repoScanner"
Repository = "https://github.com/tecnolgd/repoScanner"
Documentation = "https://github.com/tecnolgd/repoScanner#documentation"
