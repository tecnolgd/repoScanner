name: Publish Python package to PyPI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

jobs:
  build-wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set up Python (for Windows/macOS build prep)
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install pybind11 and build tools (Linux/macOS)
        if: runner.os != 'Windows'
        env:
          MACOSX_DEPLOYMENT_TARGET: '10.15'
        run: |
          python -m pip install --upgrade pip pybind11 setuptools
          python -c "from setuptools import setup, Extension; import pybind11; ext = Extension('repoScan.libcvault', sources=['vendor/bridge.cpp', 'vendor/libcvault/main.cpp'], include_dirs=[pybind11.get_include(), 'vendor/libcvault'], language='c++', extra_compile_args=['-O3', '-std=c++17']); setup(name='libcvault', ext_modules=[ext], script_args=['build_ext', '--inplace'])"
      - name: Build wheels with cibuildwheel
        uses: pypa/cibuildwheel@v2.19.2
        with:
          output-dir: wheelhouse
        env:
          # Build for Python 3.12+
          CIBW_BUILD: cp312-*
          CIBW_SKIP: pp*
          # For Windows: skip native build (pure Python fallback)
          CIBW_BEFORE_BUILD_WINDOWS: python -m pip install --upgrade pybind11
          CIBW_BEFORE_BUILD_LINUX: echo "Bridge already compiled"
          CIBW_BEFORE_BUILD_MACOS: echo "Bridge already compiled"

      - name: Upload wheels as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  publish-to-pypi:
    name: Publish wheels to PyPI
    needs: build-wheels
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install twine
        run: pip install --upgrade twine

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/*.whl
