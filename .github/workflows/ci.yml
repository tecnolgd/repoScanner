name: repoScanner CI

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  check-assignment:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Check issue assignment
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const author = pr.user.login;

            if (author === context.repo.owner) {
              console.log("PR authored by repository owner. Skipping assignment check.");
              return;
            }

            const issueMatch = (pr.body || "").match(/#(\d+)/);

            async function failPR(message) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: message,
              });

              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                state: "closed",
              });
              core.setFailed(message);
            }

            if (!issueMatch) {
              await failPR(`Hello @${author}! Please link a referenced issue (for example, 'Fixes #81') in your PR description.`);
              return;
            }

            const issueNumber = Number.parseInt(issueMatch[1], 10);
            let issue;
            try {
              ({ data: issue } = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
              }));
            } catch (error) {
              if (error.status === 404) {
                await failPR(`Hello @${author}! Referenced issue #${issueNumber} was not found.`);
                return;
              }
              throw error;
            }

            if (issue.pull_request) {
              await failPR(`Hello @${author}! Please reference an issue, not pull request #${issueNumber}.`);
              return;
            }

            const isAssigned = issue.assignees.some((assignee) => assignee.login === author);
            if (!isAssigned) {
              await failPR(`Hello @${author}, Thank you for your contribution. As per the repository's guidelines, please ensure an issue is discussed and you are assigned to it before opening a pull request. Closing this PR for now.`);
              return;
            }

            console.log(`Assignment verified for @${author} on issue #${issueNumber}.`);

  build-and-test:
    name: Build and test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out repository
        if: matrix.os != 'windows-latest'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Check out Windows sources without the conflicting wrapper
        if: matrix.os == 'windows-latest'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          sparse-checkout: |
            /repoScan/
            /tests/
            /vendor/
            /pyproject.toml
            /setup.py
            /README.md
            /LICENSE.md
            /.gitmodules
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install test and extension build dependencies
        run: python -m pip install setuptools setuptools-scm pybind11 pytest

      - name: Build native C++ extension
        run: python setup.py build_ext --inplace

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q
